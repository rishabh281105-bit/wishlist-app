name: Build Wishlist app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the signing key is set up
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing. Follow step 3 of the app setup guide."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Prepare the app screen
        run: node prepare-web.js

      - name: Create the Android project
        run: |
          npx cap add android
          node patch-android.js
          npx cap sync android

      - name: Add the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/wishlist-release.p12

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Wishlist-$APP_VERSION.apk"
          gh release create "v$APP_VERSION" "Wishlist-$APP_VERSION.apk" \
            --title "Wishlist $APP_VERSION" \
            --notes "Download Wishlist-$APP_VERSION.apk on your phone and install it over the old version."
